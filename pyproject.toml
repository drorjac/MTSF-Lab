[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynforecastlab"
version = "0.2.0"
description = "Reproducible forecasting and dynamical system identification experiments"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.13.1", "pandas==2.2.3",
  "torch==2.5.1", "torchdiffeq==0.2.5", "scikit-learn==1.5.2",
  "statsmodels==0.14.4", "matplotlib==3.9.2", "PyYAML==6.0.2", "setuptools==69.5.1", "filelock==3.16.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.10", "jupyterlab==4.3.5", "playwright==1.50.0"]
references = ["pysindy==1.7.5", "neuralforecast==1.7.7", "xgboost==2.1.4"]
research = ["optuna==4.2.1", "tensorboard==2.18.0", "mlflow-skinny==2.20.3",
            "hydra-core==1.3.2", "plotly==5.24.1", "seaborn==0.13.2", "psutil==6.1.1"]

[project.scripts]
dynforecast = "dynforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dynforecast.visualization" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


